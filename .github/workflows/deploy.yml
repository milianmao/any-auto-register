name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEPLOY_PATH: /opt/any-auto-register/deploy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: echo "image-tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_BRANCH: ${{ github.ref_name }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH,IMAGE_NAME,IMAGE_TAG,REPOSITORY_URL,DEPLOY_BRANCH,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu

            if command -v docker compose >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "docker compose or docker-compose is required" >&2
              exit 1
            fi

            mkdir -p "$DEPLOY_PATH"

            if [ -d "$DEPLOY_PATH/.git" ]; then
              git -C "$DEPLOY_PATH" remote set-url origin "$REPOSITORY_URL"
              git -C "$DEPLOY_PATH" fetch --prune origin "$DEPLOY_BRANCH"
              git -C "$DEPLOY_PATH" reset --hard "origin/$DEPLOY_BRANCH"
            elif [ -z "$(find "$DEPLOY_PATH" -mindepth 1 -maxdepth 1 ! -name data -print -quit)" ]; then
              git clone --branch "$DEPLOY_BRANCH" "$REPOSITORY_URL" "$DEPLOY_PATH"
            else
              echo "$DEPLOY_PATH is not a git repository and is not empty. Move existing files aside before deploying." >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"
            cat > docker-compose.deploy.yml <<EOF
            services:
              app:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                ports:
                  - "8000:8000"
                  - "6080:6080"
                  - "8889:8889"
                environment:
                  - DISPLAY=:99
                  - ACCOUNT_MANAGER_DATABASE_URL=sqlite:////app/data/account_manager.db
                volumes:
                  - ./data:/app/data
                restart: unless-stopped
            EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $COMPOSE -f docker-compose.deploy.yml pull
            $COMPOSE -f docker-compose.deploy.yml up -d --remove-orphans
            $COMPOSE -f docker-compose.deploy.yml ps
